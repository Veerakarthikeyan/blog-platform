server.port=8080

# ---- Database: H2 file DB (default, no install needed) ----
spring.datasource.url=jdbc:h2:file:./data/blogdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# ---- To use MySQL instead, comment the H2 lines above and uncomment these ----
# spring.datasource.url=jdbc:mysql://localhost:3306/blogdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=your_password

